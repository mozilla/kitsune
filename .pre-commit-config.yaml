default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        files: "^kitsune/"
        exclude: "^.*/migrations/.*$|kitsune/sumo/db_strings.py"
        language_version: python3.14
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.10.1
          - prettier-plugin-svelte@4.2.0
        files: "^svelte/"
  - repo: local
    hooks:
      - id: check-group-visibility-leak
        name: Check for group visibility leaks
        entry: >
          bash -c 'if grep -rn "\.groups\.all()" --include="*.py" --include="*.html" kitsune/ --exclude-dir=migrations | grep -v "# noqa: group-leak"; then
          echo "ERROR - Found .groups.all() which bypasses GroupProfile visibility";
          echo "Use profile.visible_group_profiles(viewer) or GroupProfile.objects.visible(viewer) instead";
          echo "See docs/conventions.md Security Patterns section";
          exit 1; fi'
        language: system
        pass_filenames: false
      - id: no-module-level-tests
        name: Test functions must be TestCase methods
        entry: "^def test_"
        language: pygrep
        files: "^kitsune/.*/tests/.*\\.py$"
      - id: no-def-testcase
        name: Test classes must use class, not def
        entry: "^def \\w+\\(.*TestCase\\)"
        language: pygrep
        files: "^kitsune/.*/tests/.*\\.py$"
      - id: no-assert-template-used
        name: Use template_used(); assertTemplateUsed does not see Jinja templates
        entry: "\\.assertTemplate(Not)?Used\\("
        language: pygrep
        files: "^kitsune/.*/tests/.*\\.py$"
        exclude: "^kitsune/sumo/tests/__init__\\.py$"
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies:
          - boto3-stubs==1.44.11
          - types-redis==4.6.0.20241004
          - types-requests==2.33.0.20261030
          - types-python-dateutil==2.9.0.20261122
          - types-simplejson==4.3.0.20261112
          - types-PyYAML==6.0.12.20261122
          - types-Markdown==3.11.3.20261122
        files: "^kitsune/"
        exclude: "/migrations/"
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.15.0
    hooks:
      - id: eslint
        files: "^(svelte/|webpack/).*\\.(js|ts|jsx|tsx)$"
        exclude: "webpack/.*|webpack\\..*\\.js"
        additional_dependencies:
          - eslint@10.15.0
          - eslint-plugin-import-x@4.18.1
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v18.1.0
    hooks:
      - id: stylelint
        language_version: "22.23.3"
        files: "^(kitsune/sumo/static/sumo/scss/|svelte/).*\\.(scss|svelte)$"
        additional_dependencies:
          - stylelint@18.1.0
          - stylelint-config-recommended-scss@18.0.0
          - stylelint-order@9.0.0
          - "@stylistic/stylelint-plugin@6.0.1"
          - stylelint-scss@7.5.0
          - postcss-html@2.0.1
          - postcss-scss@4.0.9
