name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.python.outputs.python-version }}-4.2.0-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint with pre-commit
        run: |
          python -m pip install pre-commit==4.2.0
          pre-commit run --all-files

  python-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wiki-tests
            app_labels: kitsune.wiki kitsune.kbforums
            elasticsearch: false
          - name: questions-tests
            app_labels: kitsune.questions
            elasticsearch: true
          - name: elasticsearch-tests
            app_labels: >-
              kitsune.search kitsune.retrieval kitsune.community kitsune.products
              kitsune.landings
            elasticsearch: true
          - name: kitsune-tests
            app_labels: >-
              kitsune.sumo kitsune.users kitsune.forums kitsune.groups kitsune.dashboards
              kitsune.customercare kitsune.kpi kitsune.upload kitsune.llm kitsune.announcements
              kitsune.gallery kitsune.notifications kitsune.messages kitsune.flagit kitsune.access
              kitsune.inproduct kitsune.kbadge kitsune.tidings kitsune.karma kitsune.tags
              kitsune.journal kitsune.watchdog
            elasticsearch: false
    env:
      APP_LABELS: ${{ matrix.app_labels }}
      ELASTICSEARCH: ${{ matrix.elasticsearch }}
      DJANGO_TEST_PROCESSES: ${{ matrix.elasticsearch && '2' || '4' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Prepare Compose environment
        run: cp .env-build .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          tags: kitsune-test:ci
          load: true
          cache-from: type=gha,scope=ci-test
          # Every partition builds the same image; export its cache only once.
          cache-to: ${{ matrix.name == 'kitsune-tests' && 'type=gha,scope=ci-test,mode=max' || '' }}

      - name: Start required services
        run: |
          services=(postgres redis)
          if [[ "$ELASTICSEARCH" == "true" ]]; then
            sudo sysctl -w vm.max_map_count=1048576
            services+=(elasticsearch)
          fi
          ./bin/dc_ci.sh up --detach --no-build "${services[@]}"

      - name: Check Python test partition coverage
        if: matrix.name == 'kitsune-tests'
        run: ./bin/dc_ci.sh run --rm --no-deps --pull never -T test ./manage.py check_test_partitions

      - name: Run unit tests
        run: |
          read -r -a app_labels <<< "$APP_LABELS"
          if [[ "$ELASTICSEARCH" == "true" ]]; then
            test_runner=./bin/run-unit-tests.sh
          else
            test_runner=./bin/run-unit-tests-no-es.sh
          fi
          ./bin/dc_ci.sh run --rm --no-deps --pull never -T test "$test_runner" "${app_labels[@]}"

      - name: Show service logs on failure
        if: failure()
        run: ./bin/dc_ci.sh logs --no-color

      - name: Stop test services
        if: always()
        run: ./bin/dc_ci.sh down --volumes --remove-orphans

  test-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run webpack:test
